<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alterar Senha - AWS Secure Inventory Portal</title>

    <style>

        body{

            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;

        }

        .card{

            width:420px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);

        }

        h1{

            text-align:center;
            color:#0070f3;

        }

        p{

            text-align:center;
            color:#666;

        }

        input{

            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            box-sizing:border-box;

        }

        button{

            width:100%;
            padding:12px;
            border:none;
            background:#0070f3;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;

        }

        button:hover{

            background:#0056d6;

        }

        .message{

            margin-top:20px;
            color:red;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="card">

    <h1>AWS Secure Inventory Portal</h1>

    <p>Primeiro acesso</p>

    <p>Defina uma nova senha para continuar.</p>

    <label>Nova senha</label>

    <input
        type="password"
        id="newPassword"
        placeholder="********">

    <label>Confirmar nova senha</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="********">

    <button onclick="changePassword()">

        Alterar senha

    </button>

    <div
        id="message"
        class="message">

    </div>

</div>

<script>

async function changePassword(){

    const username =
        localStorage.getItem("username");

    const session =
        localStorage.getItem("cognitoSession");

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(newPassword !== confirmPassword){

        document.getElementById("message").textContent =
            "As senhas não coincidem.";

        return;

    }

    try{

        const response = await fetch(

            "/auth/new-password",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    username,

                    newPassword,

                    session

                })

            }

        );

        const data = await response.json();

        if(data.success){

            alert("Senha alterada com sucesso! Faça login novamente.");

            localStorage.removeItem("username");
            localStorage.removeItem("cognitoSession");

            window.location.href="/login.html";

            return;

        }

        document.getElementById("message").textContent =
            data.message;

    }

    catch(error){

        document.getElementById("message").textContent =
            error.message;

    }

}

</script>

</body>

</html>
