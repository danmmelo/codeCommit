<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AWS Secure Inventory Portal - Secrets Manager</title>

    <link rel="stylesheet"
          href="css/styles.css">

</head>

<body>

    <header>

        <h1>AWS Secure Inventory Portal</h1>

        <p>AWS Secrets Manager</p>

    </header>

    <main>

        <!-- ========================================================= -->
        <!-- CREATE SECRET -->
        <!-- ========================================================= -->

        <section class="card">

            <h2>Create Secret</h2>

            <label for="createName">

                Secret Name

            </label>

            <input
                id="createName"
                type="text"
                placeholder="lab/database">

            <label for="createUsername">

                Username

            </label>

            <input
                id="createUsername"
                type="text"
                placeholder="admin">

            <label for="createPassword">

                Password

            </label>

            <input
                id="createPassword"
                type="password"
                placeholder="Password123!">

            <button id="createSecretButton">

                Create Secret

            </button>

        </section>

        <!-- ========================================================= -->
        <!-- SEARCH -->
        <!-- ========================================================= -->

        <section class="card">

            <h2>Search Secret</h2>

            <label for="searchName">

                Secret Name

            </label>

            <input
                id="searchName"
                type="text"
                placeholder="lab/database">

            <button id="searchSecretButton">

                Search

            </button>

            <h3>Result</h3>

            <pre id="searchResult">

No Secret loaded.

            </pre>

        </section>

        <!-- ========================================================= -->
        <!-- UPDATE -->
        <!-- ========================================================= -->

        <section class="card">

            <h2>Update Secret</h2>

            <label>

                Secret Name

            </label>

            <input
                id="updateName"
                type="text"
                placeholder="lab/database">

            <label>

                Username

            </label>

            <input
                id="updateUsername"
                type="text">

            <label>

                Password

            </label>

            <input
                id="updatePassword"
                type="password">

            <button id="updateSecretButton">

                Update Secret

            </button>

        </section>

        <!-- ========================================================= -->
        <!-- DELETE -->
        <!-- ========================================================= -->

        <section class="card">

            <h2>Delete Secret</h2>

            <label>

                Secret Name

            </label>

            <input
                id="deleteName"
                type="text"
                placeholder="lab/database">

            <button id="deleteSecretButton">

                Delete Secret

            </button>

        </section>

        <!-- ========================================================= -->
        <!-- LIST -->
        <!-- ========================================================= -->

        <section class="card">

            <h2>Secrets List</h2>

            <button id="listSecretsButton">

                Refresh

            </button>

            <ul id="secretList">

            </ul>

        </section>

    </main>

    <script src="js/secrets.js"></script>

</body>

</html>
